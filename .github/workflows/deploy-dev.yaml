name: 'Deploy dev'
on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'
  merge_group:
    types: [checks_requested]

permissions:
  contents: 'read'
  id-token: 'write'
  packages: 'write'

jobs:
  ci:
    uses: 'navikt/tms-deploy/.github/workflows/astro-deploy-v1.yaml@main'
    with:
      app-name: 'tms-utbetalingsoversikt-frontend'
      clusters: '["dev-gcp"]'
    secrets: 'inherit'

