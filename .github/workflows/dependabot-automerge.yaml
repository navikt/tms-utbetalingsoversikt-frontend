name: Dependabot Auto-merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * MON-FRI"

env:
  TZ: Europe/Oslo

jobs:
  dependabot-automerge:
    permissions:
      contents: read
      pull-requests: write
    name: Dependabot Auto-merge
    uses: navikt/tms-deploy/.github/workflows/dependabot-automerge.yaml@main
    secrets:
      APP_ID: ${{ vars.APP_CLIENT_ID }}
      PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}