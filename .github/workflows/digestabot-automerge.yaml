name: Digestabot Auto-merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

env:
  TZ: Europe/Oslo

jobs:
  digestabot-automerge:
    permissions:
      contents: read
      pull-requests: write
    uses: navikt/tms-deploy/.github/workflows/digestabot-automerge.yaml@main
    name: Digestabot Auto-merge
    secrets:
      APP_ID: ${{ vars.APP_CLIENT_ID }}
      PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}